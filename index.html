<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>static</title>
    <meta
      name="description"
      content="A minimal static site, built with Vite and deployed to Cloudflare."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --fg: #f2f2f2;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        padding: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>static</h1>
      <p>Hello from Vite and Cloudflare.</p>
    </main>
    <footer>commit __COMMIT__</footer>
  </body>
</html>

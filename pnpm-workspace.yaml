# pnpm 12 reads project settings from here (moved out of .npmrc and
# package.json#pnpm) — this is a settings file, not a workspace.

# Supply-chain cooldown, in minutes. 0 tracks the newest releases; a real
# project wants 1440+ — see base's src/content/setup.md §5.
minimumReleaseAge: 0

# Dependencies allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true

# Collapse every `vite` in the tree onto Vite+'s core build.
# Bump this alongside the `vite-plus` devDependency.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.1.0"

# Vite+'s Vite implementation is exposed through an npm alias, so
# pnpm cannot validate it against normal `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite
